name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Validate Renovate configs
        run: |
          # Every tracked .json is a Renovate config, except this package's manifest
          configs=$(git ls-files '*.json' | grep -vx 'package.json' | tr '\n' ' ')
          echo "Validating: $configs"
          npx --yes --package renovate -c "renovate-config-validator --strict --no-global $configs"
